<style>
:root{
  --bg:#f6f2ea;
  --surface:#ffffff;
  --surface-2:#faf7f1;
  --text:#2c2836;
  --muted:#726c86;
  --border:#e6dfd0;
  --accent:#54508f;
  --accent-soft:#eae7f7;
  --amber:#a9722f;
  --amber-soft:#f5ecdd;
  --rose:#a5486c;
  --rose-soft:#f7e8ee;
  --teal:#2f7d78;
  --teal-soft:#e4f2f0;
  --denim:#3f66a0;
  --denim-soft:#e7edf7;
  --good:#3f7d4c;
  --good-soft:#e6f2e8;
  --shadow: 0 1px 2px rgba(44,40,54,0.06), 0 8px 24px -12px rgba(44,40,54,0.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1824; --surface:#242032; --surface-2:#2a2638; --text:#ece8f7; --muted:#a79fc2;
    --border:#3a3550; --accent:#a6a0e8; --accent-soft:#332f52;
    --amber:#d9a866; --amber-soft:#3a3324; --rose:#e08fae; --rose-soft:#3a2733;
    --teal:#7fcac2; --teal-soft:#1f3735; --denim:#8fb0e6; --denim-soft:#232f47;
    --good:#7fcf94; --good-soft:#1f3728;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1824; --surface:#242032; --surface-2:#2a2638; --text:#ece8f7; --muted:#a79fc2;
  --border:#3a3550; --accent:#a6a0e8; --accent-soft:#332f52;
  --amber:#d9a866; --amber-soft:#3a3324; --rose:#e08fae; --rose-soft:#3a2733;
  --teal:#7fcac2; --teal-soft:#1f3735; --denim:#8fb0e6; --denim-soft:#232f47;
  --good:#7fcf94; --good-soft:#1f3728;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--text);
  font-family:"Public Sans","Hiragino Sans","Yu Gothic",sans-serif;
  padding-inline:20px; padding-block:32px 80px; margin:0;
}
.wrap{max-width:1080px;margin-inline:auto;}
h1{
  font-family:"Fraunces","Hiragino Mincho ProN",serif;
  font-optical-sizing:auto; font-weight:600;
  font-size:clamp(1.5rem,4vw,2.05rem); letter-spacing:-0.01em;
  text-wrap:balance; margin:0 0 6px;
}
.sub{color:var(--muted);font-size:0.92rem;margin:0 0 20px;line-height:1.6;}
.sub code{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-family:"IBM Plex Mono",monospace;font-size:0.85em;}

.topbar{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--bg); padding-block:10px 14px; margin-bottom:16px;
  border-bottom:1px solid var(--border);
}
.stat{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:0.85rem;color:var(--muted);}
.stat b{color:var(--accent);font-size:1rem;}
.savebadge{
  font-size:0.78rem; padding:3px 10px; border-radius:999px;
  background:var(--good-soft); color:var(--good); font-weight:600;
  transition:opacity .2s; opacity:0;
}
.savebadge.show{opacity:1;}
.savebadge.pending{background:var(--accent-soft);color:var(--accent);}

.group{margin-bottom:26px;}
.group-head{
  display:flex; align-items:baseline; gap:10px; margin-bottom:10px;
  padding-bottom:6px; border-bottom:2px solid var(--border);
}
.badge{font-size:0.72rem;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:0.02em;}
.badge.picture-book{background:var(--amber-soft);color:var(--amber);}
.badge.cinnamoroll-stopmotion{background:var(--rose-soft);color:var(--rose);}
.badge.cinnamoroll-anim{background:var(--teal-soft);color:var(--teal);}
.badge.thomas{background:var(--denim-soft);color:var(--denim);}
.group-meta{color:var(--muted);font-size:0.8rem;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow); padding:14px 16px; margin-bottom:10px;
}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;}
.card-title a{color:var(--text);text-decoration:none;font-weight:500;border-bottom:1px solid var(--border);}
.card-title a:hover{color:var(--accent);border-color:var(--accent);}
.card-meta{color:var(--muted);font-size:0.78rem;font-family:"IBM Plex Mono",monospace;white-space:nowrap;}

.row{display:flex;gap:20px;flex-wrap:wrap;align-items:center;}
.field-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:6px;display:block;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  font-family:"IBM Plex Mono",monospace; font-size:0.82rem;
  padding:6px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); cursor:pointer;
  transition:background .12s, border-color .12s, color .12s;
}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

.toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.toggle button{
  font-family:"IBM Plex Mono",monospace;font-size:0.78rem;
  padding:6px 11px;border:none;background:var(--surface-2);color:var(--muted);
  cursor:pointer;border-right:1px solid var(--border);
}
.toggle button:last-child{border-right:none;}
.toggle button.active{background:var(--accent);color:#fff;font-weight:600;}
.toggle button:hover:not(.active){color:var(--text);}

footer{margin-top:24px;color:var(--muted);font-size:0.82rem;line-height:1.7;}
</style>

y", "SkyMelody", "MusicFromSky"], "defaultCat": "stories2"}, {"id": "mRQtAdT9tjA", "title": "The Treasure We Found | Cinnamoroll Animation", "durStr": "8:30", "url": "https://youtu.be/mRQtAdT9tjA", "group": "cinnamoroll-anim", "candidates": ["TreasureWeFound", "OurTreasure", "FoundTreasure"], "defaultCat": "stories2"}]</script>

<script>
const DATA = JSON.parse(document.getElementById('row-data').textContent);
let STATE = JSON.parse(document.getElementById('state-data').textContent);

const GROUP_LABEL = {
  'picture-book': '英語絵本 読み聞かせ',
  'cinnamoroll-stopmotion': 'Cinnamoroll Stop Motion Animation',
  'cinnamoroll-anim': 'Cinnamoroll Animation(長尺)',
  'thomas': 'Thomas & Friends',
};
const GROUP_ORDER = ['picture-book','cinnamoroll-stopmotion','cinnamoroll-anim','thomas'];
const CATS = ['stories1','stories2','song1','song2'];

let artifactApi = null;
let saveTimer = null;

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAll(){
  const root = document.getElementById('groups');
  root.innerHTML = '';
  const byGroup = {};
  for(const r of DATA){ (byGroup[r.group] ||= []).push(r); }

  for(const g of GROUP_ORDER){
    const items = byGroup[g];
    if(!items || !items.length) continue;
    const gdiv = document.createElement('div');
    gdiv.className = 'group';
    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = `<span class="badge ${g}">${GROUP_LABEL[g]}</span><span class="group-meta">${items.length}本</span>`;
    gdiv.appendChild(head);

    for(const r of items){
      gdiv.appendChild(renderCard(r));
    }
    root.appendChild(gdiv);
  }
  updateCount();
}

function renderCard(r){
  const s = STATE[r.id];
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head">
      <span class="card-title"><a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a></span>
      <span class="card-meta">${r.durStr} ・ ${r.id}</span>
    </div>
    <div class="row">
      <div>
        <span class="field-label">出力名</span>
        <div class="chips" data-id="${r.id}" data-kind="name">
          ${r.candidates.map(c => `<button type="button" class="chip ${s.name===c?'active':''}" data-val="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
        </div>
      </div>
      <div>
        <span class="field-label">カテゴリ</span>
        <div class="toggle" data-id="${r.id}" data-kind="cat">
          ${CATS.map(c => `<button type="button" class="${s.cat===c?'active':''}" data-val="${c}">${c}</button>`).join('')}
        </div>
      </div>
    </div>
  `;
  card.querySelectorAll('.chips button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.parentElement.dataset.id;
      STATE[id].name = btn.dataset.val;
      btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
      scheduleSave();
    });
  });
  card.querySelectorAll('.toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.parentElement.dataset.id;
      STATE[id].cat = btn.dataset.val;
      btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
      scheduleSave();
    });
  });
  return card;
}

function updateCount(){
  document.getElementById('totalCount').textContent = DATA.length;
  document.getElementById('doneCount').textContent = DATA.length;
}

function scheduleSave(){
  const badge = document.getElementById('saveBadge');
  badge.textContent = '保存中…';
  badge.classList.add('show','pending');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 700);
}

async function doSave(){
  document.getElementById('state-data').textContent = JSON.stringify(STATE);
  const badge = document.getElementById('saveBadge');
  if(!artifactApi){
    badge.textContent = '保存不可(接続待ち)';
    return;
  }
  try{
    await artifactApi.publish('<!doctype html>\n' + document.documentElement.outerHTML);
    badge.textContent = '保存済み';
    badge.classList.remove('pending');
  }catch(e){
    badge.textContent = '保存失敗: ' + (e && e.code ? e.code : e);
    badge.classList.remove('pending');
  }
}

renderAll();

(async () => {
  if(window.claude && window.claude.use){
    artifactApi = await window.claude.use('artifact');
  }
})();
</script>
